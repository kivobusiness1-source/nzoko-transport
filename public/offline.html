<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hors connexion — OCÉAN DU NORD</title>
  <meta name="theme-color" content="#0B6E4A" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0B6E4A 0%, #0a5c3e 100%);
      color: #fff; padding: 24px; text-align: center;
    }
    .card {
      background: #fff; color: #1a2e25; border-radius: 20px; padding: 40px 28px;
      max-width: 420px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.25);
    }
    .logo { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
      background: #0B6E4A; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 44px; height: 44px; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    p { font-size: 15px; line-height: 1.6; color: #4b5f56; margin-bottom: 8px; }
    .hint { font-size: 13px; color: #7b8a83; margin-bottom: 24px; }
    a.button {
      display: inline-block; background: #0B6E4A; color: #fff; text-decoration: none;
      font-weight: 600; font-size: 15px; padding: 14px 28px; border-radius: 12px;
      min-height: 44px; transition: background .2s;
    }
    a.button:active { background: #0a5c3e; }
    footer { margin-top: 20px; font-size: 11px; color: #9db3a9; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="80" y="130" width="352" height="230" rx="34" fill="#ffffff"/>
        <rect x="112" y="162" width="86" height="60" rx="12" fill="#0B6E4A"/>
        <rect x="212" y="162" width="86" height="60" rx="12" fill="#0B6E4A"/>
        <rect x="312" y="162" width="86" height="60" rx="12" fill="#0B6E4A" opacity=".55"/>
        <rect x="112" y="240" width="240" height="16" rx="8" fill="#F59E0B"/>
        <rect x="330" y="240" width="48" height="102" rx="10" fill="#F59E0B"/>
        <circle cx="160" cy="382" r="30" fill="#1F2937"/><circle cx="352" cy="382" r="30" fill="#1F2937"/>
        <circle cx="160" cy="382" r="12" fill="#E5E7EB"/><circle cx="352" cy="382" r="12" fill="#E5E7EB"/>
      </svg>
    </div>
    <h1>Vous êtes hors connexion</h1>
    <p>OCÉAN DU NORD n'a pas pu joindre le réseau.</p>
    <p class="hint">Vérifiez votre connexion mobile ou Wi-Fi, puis réessayez. Vos billets déjà émis restent consultables une fois reconnecté.</p>
    <a class="button" href="/">Réessayer</a>
    <footer>OCÉAN DU NORD · Voyagez simplement. Voyagez en confiance.</footer>
  </main>
</body>
</html>
